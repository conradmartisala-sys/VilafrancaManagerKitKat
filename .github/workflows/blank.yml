name: Compilar APK Vilafranca Manager

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Instalar Android SDK necesario
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.2"

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Extraer proyecto Android
        run: |
          unzip -q VilafrancaManagerKitKat-AndroidProject.zip -d proyecto
          echo "Contenido extraído:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Dar permisos a Gradle
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -1)
          echo "Gradle encontrado en: $GRADLEW"
          test -n "$GRADLEW"
          chmod +x "$GRADLEW"

      - name: Compilar APK
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -1)
          PROYECTO=$(dirname "$GRADLEW")
          echo "Proyecto: $PROYECTO"
          cd "$PROYECTO"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VilafrancaManagerKitKat-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
