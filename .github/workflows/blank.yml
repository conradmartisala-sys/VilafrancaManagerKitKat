name: Compilar APK Vilafranca Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Instalar Android SDK necesario
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.2"

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Extraer proyecto Android
        run: |
          unzip -q VilafrancaManagerKitKat-AndroidProject.zip -d proyecto
          echo "=== CONTENIDO DEL ZIP ==="
          find proyecto -type f | sort
          echo "=== FIN DEL CONTENIDO ==="

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      - name: Compilar APK
        run: |
          cd proyecto/VilafrancaKitKatApp
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VilafrancaManagerKitKat-APK
          path: proyecto/VilafrancaKitKatApp/app/build/outputs/apk/debug/app-debug.apk
