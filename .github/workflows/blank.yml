name: Compilar APK Vilafranca Manager

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK necesario
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.2"

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VilafrancaManagerKitKat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          name: VilafrancaManagerKitKat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
